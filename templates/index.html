<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Expense Splitter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 12px; }
    h1 { margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    input, button { padding: 8px; margin: 4px 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    ul { margin-top: 6px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Team Expense Splitter</h1>
  <p class="muted">Add members and expenses, then see who should pay whom.</p>

  <div class="card">
    <h3>Members</h3>
    <div class="row">
      <div><input id="memberInput" placeholder="e.g., Alice" /></div>
      <div><button onclick="addMember()">Add Member</button></div>
    </div>
    <div id="members"></div>
  </div>

  <div class="card">
    <h3>Add Expense</h3>
    <div class="row">
      <div><input id="desc" placeholder="Description (Lunch)" /></div>
      <div><input id="amount" type="number" step="0.01" placeholder="Amount" /></div>
      <div>
        <select id="paidBy"></select>
      </div>
    </div>
    <div>
      <strong>Participants:</strong>
      <div id="participants"></div>
    </div>
    <button onclick="addExpense()">Add Expense</button>
    <div id="expenseMsg" class="muted"></div>
  </div>

  <div class="card">
    <h3>Expenses</h3>
    <ul id="expenseList"></ul>
  </div>

  <div class="card">
    <h3>Summary</h3>
    <button onclick="loadSummary()">Calculate Settlement</button>
    <p><strong>Total:</strong> <span id="total">0</span></p>
    <h4>Balances</h4>
    <ul id="balances"></ul>
    <h4>Who pays whom</h4>
    <ul id="settlements"></ul>
  </div>

  <div class="card">
    <button onclick="resetAll()">Reset Event</button>
  </div>

<script>
  const members = [];

  function renderMembers() {
    document.getElementById('members').innerText = members.length ? members.join(', ') : 'No members yet';

    const paidBy = document.getElementById('paidBy');
    paidBy.innerHTML = '';
    members.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      paidBy.appendChild(opt);
    });

    const partDiv = document.getElementById('participants');
    partDiv.innerHTML = '';
    members.forEach(m => {
      const label = document.createElement('label');
      label.style.marginRight = '10px';
      label.innerHTML = `<input type="checkbox" value="${m}" checked /> ${m}`;
      partDiv.appendChild(label);
    });
  }

  function addMember() {
    const input = document.getElementById('memberInput');
    const name = input.value.trim();
    if (!name) return;
    if (!members.includes(name)) members.push(name);
    input.value = '';
    renderMembers();
  }

  async function addExpense() {
    const description = document.getElementById('desc').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const paid_by = document.getElementById('paidBy').value;
    const participants = Array.from(document.querySelectorAll('#participants input:checked')).map(x => x.value);

    const res = await fetch('/expenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, amount, paid_by, participants })
    });

    const msg = document.getElementById('expenseMsg');
    if (!res.ok) {
      const err = await res.json();
      msg.textContent = `Error: ${err.error || 'failed to add expense'}`;
      return;
    }

    msg.textContent = 'Expense added';
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    await loadExpenses();
    await loadSummary();
  }

  async function loadExpenses() {
    const res = await fetch('/expenses');
    const data = await res.json();
    const ul = document.getElementById('expenseList');
    ul.innerHTML = '';
    data.expenses.forEach(e => {
      const li = document.createElement('li');
      li.textContent = `${e.description}: ${e.amount} paid by ${e.paid_by} for [${e.participants.join(', ')}]`;
      ul.appendChild(li);
    });
  }

  async function loadSummary() {
    const res = await fetch('/summary');
    const data = await res.json();

    document.getElementById('total').textContent = data.total_expenses;

    const bal = document.getElementById('balances');
    bal.innerHTML = '';
    Object.entries(data.balances).forEach(([name, amount]) => {
      const li = document.createElement('li');
      li.textContent = `${name}: ${amount}`;
      bal.appendChild(li);
    });

    const set = document.getElementById('settlements');
    set.innerHTML = '';
    if (!data.settlements.length) {
      const li = document.createElement('li');
      li.textContent = 'All settled ✅';
      set.appendChild(li);
      return;
    }

    data.settlements.forEach(s => {
      const li = document.createElement('li');
      li.textContent = `${s.from} pays ${s.to}: ${s.amount}`;
      set.appendChild(li);
    });
  }

  async function resetAll() {
    await fetch('/reset', { method: 'POST' });
    document.getElementById('expenseList').innerHTML = '';
    document.getElementById('balances').innerHTML = '';
    document.getElementById('settlements').innerHTML = '';
    document.getElementById('total').textContent = '0';
    document.getElementById('expenseMsg').textContent = 'Reset done';
  }

  renderMembers();
  loadExpenses();
  loadSummary();
</script>
</body>
</html>
